[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sidevoice-server"
version = "0.4.0"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["sidevoice"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
